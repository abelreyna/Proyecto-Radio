name: radios_peru_mix
description: "Radios Perú Mix: directorio y reproductor de radios del Perú en vivo."
publish_to: 'none'

# versionName+versionCode (Android) / CFBundleShortVersionString+CFBundleVersion (iOS)
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Motor de audio, metadatos ICY y audio en segundo plano
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  # Peticiones de red (JSON de GitHub y Radio Browser API)
  http: ^1.6.0
  # Favoritos y preferencias en el dispositivo
  shared_preferences: ^2.5.6
  # Gestión de estado
  provider: ^6.1.5+1
  # Compartir y enlaces profundos
  share_plus: ^13.3.1
  app_links: ^7.2.2
  # Abrir la política de privacidad en el navegador
  url_launcher: ^6.3.2
  # Caché de logos
  cached_network_image: ^4.0.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/data/radios_peru.json

# Íconos de la app: dart run flutter_launcher_icons
# (las imágenes se regeneran con tool/generar_graficos.ps1)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#D91023"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 24

# Pantalla de carga: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#D91023"
  image: assets/icon/splash.png
  android_12:
    color: "#D91023"
    image: assets/icon/splash_android12.png
  android: true
  ios: true
