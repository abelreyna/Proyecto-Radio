<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radios Perú Mix</title>
  <link rel="icon" href="icon.png">
  <style>
    :root { --bg: #ffffff; --text: #1d1b1b; --muted: #5c5555; --accent: #d91023; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121010; --text: #f3eded; --muted: #b9adad; --accent: #ff5a66; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; padding: 32px 16px; text-align: center; }
    img { width: 120px; height: 120px; border-radius: 28px; }
    h1 { margin: 16px 0 4px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <img src="icon.png" alt="Ícono de Radios Perú Mix">
  <h1>Radios Perú Mix</h1>
  <p>Escucha las radios del Perú en vivo: noticias, cumbia, salsa, rock &amp; pop,
    folklore y emisoras de todas las regiones. Sin registro y sin publicidad.</p>
  <p><a href="privacidad.html">Política de privacidad</a></p>
</main>
</body>
</html>
